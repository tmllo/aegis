# Live inputs the crew app can measure itself (session 1f, 2026-11-15): camera scan (breathing), the simulated
# wrist band (SpO2) and the reaction test (PVT, the Psychomotor Vigilance Test ISS crews use for fatigue).
# kind self_report so POST /api/observations accepts them (server/mind/records.py checkin_batch); no contract_key,
# so the v1 JSON files do not change. Scored against the member's own baseline once 14 days exist.
metrics:
- key: vital.spo2
  label: Blood oxygen
  unit: '%'
  kind: self_report
  hazard: closed_environment
  body_region: whole_body
  absolute_red:
    min: 90
    max: 100
  rule:
    type: display_only
  explain: Oxygen saturation from the wrist band. In a closed cabin, a drop can come from cabin air or from the body.
  how_to_measure: Wrist band, at rest.
  actions:
    amber: Re-measure at rest and check the cabin oxygen reading.
    red: Tell the crew medical officer now and check the cabin oxygen reading.
