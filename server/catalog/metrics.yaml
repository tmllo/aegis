  hazard: multiple
  body_region: blood
  rule:
    type: pre_flight_baseline
    far_z: 2
- key: cabin.pressure
  label: Cabin pressure (US Lab)
  unit: mmHg
  kind: habitat_telemetry
  source_item: USLAB000058
  hazard: closed_environment
  body_region: whole_body
  rule:
    type: bands
    bands:
      red_low: 690
      amber_low: 735
      amber_high: 790
      red_high: 800
    source: Team
    emergency_below: 690
  display:
    order: 1
    label: Cabin pressure
    short: Pressure
    digits: 0
- key: cabin.temp
  label: Cabin temperature (US Lab)
  unit: degC
  kind: habitat_telemetry
  source_item: USLAB000059
  hazard: closed_environment
  body_region: whole_body
  rule:
    type: bands
    bands:
      red_low: 15
      amber_low: 18.3
      amber_high: 26.7
      red_high: 30
    source: Team
  display:
    order: 5
    label: Cabin temperature
    short: Temperature
    digits: 1
    unit: °C
- key: cabin.ppo2
  label: Oxygen partial pressure (US Lab)
  unit: mmHg
  kind: habitat_telemetry
  source_item: USLAB000053
  hazard: closed_environment
  body_region: whole_body
  rule:
    type: bands
    bands:
      red_low: 122
      amber_low: 127
    source: NASA
    ref: 'NASA-STD-3001 V2: inspired ppO2 floor 127 mmHg with monitoring, 1-hour floor 122 mmHg'
  display:
    order: 2
    label: Oxygen, partial pressure
    short: ppO2
    digits: 0
- key: cabin.ppco2
  label: CO2 partial pressure (US Lab)
  unit: mmHg
  kind: habitat_telemetry
  source_item: USLAB000055
  hazard: closed_environment
  body_region: brain
  rule:
    type: bands
    bands:
      amber_high: 2.5
      red_high: 3.0
    source: NASA
    ref: 'NASA-STD-3001 V2 6004: 1-hour average at or below 3 mmHg. Headaches reported from 2.8 mmHg, fatigue and nausea above 4.5 mmHg'
  display:
    order: 3
    label: CO2, partial pressure
    short: ppCO2
    digits: 2
