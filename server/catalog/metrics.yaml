- key: lab.i4.hemoglobin
  contract_key: hemoglobin
  label: Hemoglobin
  unit: g/dL
  kind: lab_draw
  panel: cbc
  source_column: hemoglobin_value_percent
  hazard: multiple
  body_region: blood
  rule:
    type: pre_flight_baseline
    far_z: 2
  unit_note: The source column is named hemoglobin_value_percent. The numbers and the printed interval match g/dL, not percent.
    Hematocrit is the percent column and is not used here.
- key: lab.i4.calcium
  contract_key: calcium
