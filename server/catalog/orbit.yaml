# Orbit layer config (docs/backend/ORBIT.md). Read as cat.extra["orbit"].
# A new satellite group = one entry under `groups` + its file data/orbits/celestrak/<id>.tle (live: fetched by id).

# Station subjects whose track the server propagates (GET /api/orbit?subject=). Subject id -> NORAD catalogue number.
stations:
  iss: 25544        # ISS (ZARYA)
  tiangong: 48274   # CSS (TIANHE), core module of Tiangong

# Every CelesTrak group, each one a toggle on the globe. kind: crewed | navigation | comms | observation | scenery
groups:
- id: stations
  label: Crewed stations
  kind: crewed
  default_on: true
  about: ISS and Tiangong with their modules and visiting vehicles. Tracks computed by the server with sunlit and SAA colouring.
- id: visual
  label: Brightest satellites
  kind: observation
  default_on: false
  about: The satellites bright enough to see with the naked eye.
- id: gps-ops
  label: GPS
  kind: navigation
  default_on: false
  about: Operational GPS constellation (USA).
- id: galileo
  label: Galileo
  kind: navigation
  default_on: false
  about: Galileo navigation constellation (EU).
- id: glo-ops
  label: GLONASS
  kind: navigation
  default_on: false
  about: Operational GLONASS constellation (Russia).
- id: geo
  label: Geostationary ring
  kind: comms
  default_on: false
  about: Geostationary weather and communications satellites.
- id: starlink
  label: Starlink
  kind: comms
  default_on: false
  about: SpaceX Starlink broadband constellation.
- id: active
  label: Every active satellite
  kind: scenery
  default_on: false
  about: Every active satellite CelesTrak tracks (includes all of the groups above).

# Same credit on every group (CelesTrak asks for a citation).
credit: 'CelesTrak (celestrak.org), Dr. T.S. Kelso'

# How often the live adapter may download one group (CelesTrak asks not to fetch faster than the data changes).
min_fetch_interval_h: 6
