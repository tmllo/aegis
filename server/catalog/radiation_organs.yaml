# Organ dose, cancer-risk share, shielding stages and the forecast explainer.
# Every number is {value, source}. source is S1..S12 from RADIATION-ORGAN-DATA.md, or HAND-SET.
# tag DERIVED means arithmetic on a cited number. tag HAND-SET means we chose the working value.
# Doses are NASA dose equivalent (mSv) unless a stage block says otherwise. No real astronaut doses.

iss_trapped_share: {value: 0.4, source: HAND-SET, tag: HAND-SET, basis: "Inside the ISS, 40% of dose equivalent uses the trapped-proton profile and 60% the uniform GCR profile. Outside, MTR-DOSTEL saw trapped about 60% of dose equivalent (S6); inside it is lower."}
reid_per_mSv_pct: {value: 0.005, source: S10, tag: DERIVED, basis: "600 mSv effective is about 3% REID, so 3 / 600 = 0.005 percent per mSv. Linear scaling, not NSCR-2012."}
remainder_d_rel: {value: 0.198, source: S8}
remainder_w_T: {value: 0.12, source: S7}
risk_remainder_ids: [brain, salivary, heart, kidney, pancreas, spleen]
effective_remainder_ids: [heart, kidney, pancreas, spleen]
limit_note: "Limits are mGy-Eq; organ values are NASA dose equivalent (mSv). Comparison approximate."
level_green_below_pct: {value: 50, source: HAND-SET}
level_red_at_pct: {value: 100, source: HAND-SET}
level_bg_days: {value: 30, source: S10, basis: "The 30-day limit column. spe and storm compare the event dose plus this many days of background."}

paper_effective_mSv:
  aug1972:
    hull: {value: 204.2, source: S4}
    vest: {value: 85.3, source: S4}
  oct1989:
    hull: {value: 219.0, source: S4}
    vest: {value: 138.2, source: S4}

limits:
  career_effective_mSv: {value: 600, source: S10, unit: mSv}
  design_ref_spe_mSv: {value: 250, source: S10, unit: mSv}
  lens:
    organ: eye_lens
    unit: mGy-Eq
    d30: {value: 1000, source: S10}
    y1: {value: 2000, source: S10}
    career: {value: 4000, source: S10}
  skin:
    organ: skin
    unit: mGy-Eq
    d30: {value: 1500, source: S10}
    y1: {value: 3000, source: S10}
    career: {value: 6000, source: S10}
  bfo:
    organ: red_marrow
    unit: mGy-Eq
    d30: {value: 250, source: S10}
    y1: {value: 500, source: S10}
    career: {value: null, source: S10}
  circulatory:
    organ: heart
    unit: mGy-Eq
    d30: {value: 250, source: S10}
    y1: {value: 500, source: S10}
    career: {value: 1000, source: S10}
  cns:
    organ: brain
    unit: mGy
    d30: {value: 500, source: S10}
    y1: {value: 1000, source: S10}
    career: {value: 1500, source: S10}

gcr:
  profile_uniform: {value: 1.0, source: S3, basis: "Artemis I GCR-phase organ doses spread under 8%, so Moon, transit and Mars use a flat profile."}
  artemis_i_mGy:
    skin_front: {value: 9.38, source: S3}
    lung: {value: 9.44, source: S3}
    stomach: {value: 9.42, source: S3}
    uterus: {value: 10.07, source: S3}
    spine: {value: 9.56, source: S3}
    skin_back: {value: 10.17, source: S3}
  rate_mGy_day: {value: 0.379, source: S4}
  quality_factor: {value: 3.1, source: S4}
  rate_mSv_day: {value: 1.18, source: S4, tag: DERIVED}
  thicker_shield_note: "For GCR, thicker shielding can raise absorbed dose because of secondaries (S6): about 85 uGy/day behind 20 g/cm2 Al versus 100 uGy/day behind 35 g/cm2."

body_gradient:
  skin_to_deep: {value: 20, source: S1}
  note: "ISS EVA phantom. Skin dose was about 20 times the deep-organ dose."

