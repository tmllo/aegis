# Aug 1972 aluminium stages, Wilson 1997 Table 5. Doses stored in cSv; the engine converts x10 to mSv.
stages:
  aug1972:
    source: S5
    dose_unit: cSv
    mSv_per_unit: {value: 10, source: S5, basis: "1 cSv = 10 mSv."}
    items:
    - {id: space, label: "Open space", areal_g_cm2: {value: 0, source: S5}, skin: {value: null, source: S5}, lens: {value: null, source: S5}, bfo: {value: null, source: S5}}
    - {id: suit, label: "Space suit (EVA)", areal_g_cm2: {value: 0.4, source: S5}, skin: {value: 9350, source: S5}, lens: {value: 3830, source: S5}, bfo: {value: 217, source: S5}}
    - {id: vessel, label: "Pressure vessel", areal_g_cm2: {value: 1, source: S5}, skin: {value: 3560, source: S5}, lens: {value: 2140, source: S5}, bfo: {value: 180, source: S5}}
    - {id: room, label: "Equipment room", areal_g_cm2: {value: 5, source: S5}, skin: {value: 427, source: S5}, lens: {value: 367, source: S5}, bfo: {value: 65, source: S5}}
    - {id: shelter, label: "Storm shelter", areal_g_cm2: {value: 10, source: S5}, skin: {value: 110, source: S5}, lens: {value: 101, source: S5}, bfo: {value: 24, source: S5}}
    orion:
      id: orion
      label: "Orion cabin"
      areal_g_cm2: {value: 24.8, source: S4}
      skin_mSv: {value: 708.4, source: S4}
      bfo_mSv: {value: 105.9, source: S4}
      basis: "Aug 1972 whole-body hull, no vest. Different model from the aluminium slab table."
  oct1989:
    source: S9
    dose_unit: cGy
    mSv_per_unit: {value: 10, source: S9, tag: HAND-SET, basis: "Absorbed dose in cGy, shown x10 as mGy. Not NASA dose equivalent."}
    items:
    - {id: space, label: "Open space", areal_g_cm2: {value: 0, source: S9}, skin: {value: null, source: S9}, bfo: {value: null, source: S9}}
    - {id: w05, label: "0.5 cm water", areal_g_cm2: {value: 0.5, source: S9}, skin: {value: 721, source: S9}, bfo: {value: 80, source: S9}}
    - {id: w2, label: "2 cm water", areal_g_cm2: {value: 2, source: S9}, skin: {value: 298, source: S9}, bfo: {value: 55, source: S9}}
    - {id: w5, label: "5 cm water", areal_g_cm2: {value: 5, source: S9}, skin: {value: 96, source: S9}, bfo: {value: 31, source: S9}}
    - {id: w10, label: "10 cm water", areal_g_cm2: {value: 10, source: S9}, skin: {value: 35, source: S9}, bfo: {value: 15, source: S9}}

actions:
  none: "No action needed"
  watch: "Stay within reach of the shelter"
  warning: "Go to the shelter"

how_it_works:
- "Every solar flare NASA DONKI reports is scored the moment it peaks."
- "Inputs: flare class, where it sits on the Sun (western flares are magnetically connected to us), and whether a fast CME left with it."
- "A logistic model trained on 2010-2023 gives the chance of a >=10 MeV proton storm within 72 h."
- "Above the watch line: stay near the shelter. Above the warning line: go to the shelter."
- "Tested only on 2024-2026 flares it never saw."

sources:
- {id: S1, label: "Reitz et al. 2009, Radiation Research (ISS EVA phantom)", url: "https://doi.org/10.1667/rr1559.1"}
- {id: S2, label: "Reitz, MATROSHKA phantom platform", url: "https://three.jsc.nasa.gov/articles/PhantomsReitz.pdf"}
- {id: S3, label: "Artemis I MARE/HERA team 2024, Nature", url: "https://doi.org/10.1038/s41586-024-07927-7"}
