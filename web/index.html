    <div id="boot" role="status" aria-label="Loading">
      <div class="boot-img boot-lqip"></div>

        alt=""
        src="/loading/loading-cupola-1440.jpg"
        srcset="/loading/loading-cupola-1440.jpg 1440w, /loading/loading-cupola-2560.jpg 2560w"
        sizes="100vw"
        decoding="async"
        fetchpriority="high"
      />

      <div class="boot-ui">
        <div class="boot-mark">e<sup>x</sup></div>
        <div class="boot-line"><i></i></div>
        <p class="boot-credit">Earth: NASA Blue Marble and Black Marble, public domain &middot; Body: MakeHuman, CC0</p>
      </div>
    </div>
    <script>
      (function () {
        var img = document.querySelector('#boot .boot-full');
        var sharp = function () { document.getElementById('boot').classList.add('boot-sharp'); };
        if (img.decode) img.decode().then(sharp, sharp); else img.onload = sharp;
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
