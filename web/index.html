<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>eˣ Crew Station</title>
    <link rel="preload" as="image" href="/loading/loading-crew-poster.jpg" fetchpriority="high" />
    <link rel="preload" as="video" href="/loading/loading-crew-1080.webm" type="video/webm" fetchpriority="high" />
    <link rel="preload" href="/models/body.glb" as="fetch" crossorigin="anonymous" />
    <link rel="prefetch" href="/refs/earth/blue-marble-4k.jpg" />
    <style>
      /* Loading screen, first paint. Order: inline placeholder, poster, then the intro clip
         (once per session, plays once, holds its last frame). Graded to the console navy; the
         e^x mark and hairline sit where the console's own mark and top-bar line are.
         src/boot.ts drives the hairline from the real loads and fades into the app. */
      #boot { position: fixed; inset: 0; z-index: 2147483000; background: #02040a; overflow: hidden; transition: opacity 700ms cubic-bezier(0.16, 1, 0.3, 1); font-family: 'Inter Tight', system-ui, sans-serif; font-weight: 300; color: rgb(236 242 243); }
      #boot.boot-out { opacity: 0; pointer-events: none; }
      #boot .boot-layer { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #boot .boot-lqip { background: #02040a url("data:image/jpeg;base64,/9j//gAQTGF2YzYyLjI4LjEwMQD/2wBDAAgQEBMQExYWFhYWFhoYGhsbGxoaGhobGxsdHR0iIiIdHR0bGx0dICAiIiUmJSMjIiMmJigoKDAwLi44ODpFRVP/xABwAAADAQEBAAAAAAAAAAAAAAAGBwMFBAABAQEBAQAAAAAAAAAAAAAAAAABAwIQAAIABAQEBAcBAQAAAAAAAAECAxEAITESBAVBMzJxIlFhgbKxgnNicsETFBEBAQEBAQAAAAAAAAAAAAAAAAFBAhH/wAARCAASACADASIAAhEAAxEA/9oADAMBAAIRAxEAPwBSxIsSKxcuXY4ljmJ7k1GCjxGCBSczASGMyZYd69AUXdulbkDE+Q960oD5IyuvhNiJDCTA2xNjKtZ3ZSNrWbHG0aF3ZAw8f+YvlX1OE5XtQaYRZ8qBnMpyW/Dj5UyNXuP/AGxwXULMZLEyIGCtfiLTowXXaeCoSFCgr4Z5URDl4XMse5nWXoSa8s9xRbBVRBnIdETh+NCS8v3FGELkfTE+Gi46N4hokPRlVVSYSkkACZliZY11bX0ufNVn641PeuVovsr8qptfS36r/a5TH//Z") center / cover no-repeat; filter: blur(16px); transform: scale(1.06); }
      #boot .boot-poster { opacity: 0; transition: opacity 500ms ease-out; filter: saturate(0.15) brightness(0.8); }
      #boot.boot-has-poster .boot-poster { opacity: 1; }
      #boot video { opacity: 0; transition: opacity 500ms ease-out; filter: saturate(0.15) brightness(0.8); }
      #boot.boot-playing video { opacity: 1; }
      /* grade: navy tint, then the console's dark field toward the edges */
      #boot .boot-grade { position: absolute; inset: 0; background: rgb(40 66 70); mix-blend-mode: color; opacity: 0.35; }
      #boot .boot-shade { position: absolute; inset: 0; background: radial-gradient(70% 70% at 50% 55%, rgba(2, 4, 10, 0.2), rgba(2, 4, 10, 0.8)), linear-gradient(180deg, rgba(2, 4, 10, 0.75) 0, rgba(2, 4, 10, 0) 18%, rgba(2, 4, 10, 0) 70%, rgba(2, 4, 10, 0.9) 100%); }
      /* mark and hairline at the console's top-bar positions */
      #boot .boot-mark { position: absolute; left: 28px; top: 24px; height: 28px; font-size: 28px; line-height: 28px; letter-spacing: -0.02em; opacity: 0; }
      #boot.boot-font .boot-mark { animation: boot-in 500ms ease-out 400ms both; }
      @keyframes boot-in { from { opacity: 0; } to { opacity: 1; } }
      #boot .boot-mark span { position: relative; top: -0.75em; font-size: 0.55em; margin-left: 1px; }
      #boot .boot-line { position: absolute; left: 0; right: 0; top: 75px; height: 1px; background: rgba(255, 255, 255, 0.06); overflow: hidden; }
      #boot .boot-line i { position: absolute; inset: 0; background: rgb(79 224 232); transform-origin: left; transform: scaleX(var(--p, 0.04)); transition: transform 400ms cubic-bezier(0.16, 1, 0.3, 1); }
      #boot .boot-skip { position: absolute; right: 24px; top: 18px; height: 40px; padding: 0 18px; border: 1px solid rgba(170, 190, 230, 0.35); border-radius: 8px; background: transparent; color: rgb(233 238 248); font: inherit; font-size: 14px; letter-spacing: 0.04em; cursor: pointer; opacity: 0; pointer-events: none; transition: opacity 300ms; }
      #boot.boot-playing .boot-skip { opacity: 0.8; pointer-events: auto; }
      #boot .boot-credit { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; font-size: 10px; color: rgba(98, 112, 116, 0.9); }
      html:not(.boot-done) [data-concept] .cc-top, html:not(.boot-done) [data-concept] .cc-bar { animation-play-state: paused; }
      @media (prefers-reduced-motion: reduce) {
        #boot { transition: opacity 400ms linear; }
        #boot .boot-poster { transition: none; }
        #boot .boot-line i { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-label="Loading">
      <div class="boot-layer boot-lqip"></div>
      <img class="boot-layer boot-poster" alt="" src="/loading/loading-crew-poster.jpg" decoding="async" fetchpriority="high" />
      <video class="boot-layer" muted playsinline autoplay preload="auto" poster="/loading/loading-crew-poster.jpg" aria-hidden="true">
        <source src="/loading/loading-crew-720.mp4" type="video/mp4" media="(max-width: 1440px)" />
        <source src="/loading/loading-crew-1080.webm" type="video/webm" />
        <source src="/loading/loading-crew-1080.mp4" type="video/mp4" />
      </video>
      <div class="boot-grade"></div>
      <div class="boot-shade"></div>
      <div class="boot-mark">e<span>x</span></div>
      <div class="boot-line"><i></i></div>
      <button type="button" class="boot-skip">Skip</button>
      <p class="boot-credit">Video: NASA, KSC-20190225-MH-SPX01-0001, CC0</p>
    </div>
    <script>
      (function () {
        var boot = document.getElementById('boot');
        var poster = boot.querySelector('.boot-poster');
        var showPoster = function () { boot.classList.add('boot-has-poster'); };
        if (poster.decode) poster.decode().then(showPoster, showPoster); else poster.onload = showPoster;

        // the intro clip: first load of a session only, never with reduced motion
        var done = function () {
          if (boot.dataset.intro === 'done') return;
          boot.dataset.intro = 'done';
          boot.classList.remove('boot-playing');
          boot.dispatchEvent(new Event('intro-done'));
        };
        var seen = false;
        try { seen = sessionStorage.getItem('ex-intro') === '1'; sessionStorage.setItem('ex-intro', '1'); } catch (e) {}
        var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (seen || reduce) { boot.dataset.intro = 'done'; var sv = boot.querySelector('video'); if (sv) { sv.pause(); sv.remove(); } return; }
        boot.dataset.intro = 'playing';

        var v = boot.querySelector('video');
        var srcs = v.querySelectorAll('source');
        srcs[srcs.length - 1].addEventListener('error', done); // last source failed: poster stays
        v.addEventListener('playing', function () { try { performance.mark('intro-playing'); } catch (e) {} }, { once: true });
        var started = false;
        var start = function () {
          if (started || boot.dataset.intro === 'done') return;
          started = true;
          var p = v.play();
          if (p && p.then) p.then(function () { boot.classList.add('boot-playing'); }, done);
          else boot.classList.add('boot-playing');
        };
        v.addEventListener('canplaythrough', start, { once: true });
        v.addEventListener('loadeddata', function () { setTimeout(function () { if (v.readyState >= 3) start(); }, 300); }, { once: true });
        // no loop: when it ends it holds on its last frame until the app is ready
        v.addEventListener('error', done);
        setTimeout(function () { if (!started) done(); }, 4000); // never wait on a slow clip
        var skip = function () { boot.dispatchEvent(new Event('intro-skip')); };
        boot.querySelector('.boot-skip').addEventListener('click', skip);
        var onKey = function (e) { if (!document.getElementById('boot')) return removeEventListener('keydown', onKey); if (e.key === 'Enter' || e.key === 'Escape') skip(); };
        addEventListener('keydown', onKey);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
